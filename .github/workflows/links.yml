name: Check outbound links
# Weekly, because a link only goes bad between pushes: a lapsed third-party
# service is a name someone else can register.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check outbound links
        run: node scripts/links.cjs
