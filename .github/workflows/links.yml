name: Check outbound links
# Weekly, because a link only goes bad between pushes: a lapsed third-party
# service is a name someone else can register.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check outbound links
        run: node scripts/links.cjs
